# Server Configuration
server:
  port: 8081

spring:
  # Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:cowtrack}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: CowTrackHikariPool

  jpa:
    open-in-view: false  # Avoids holding a DB connection for the whole request
    hibernate:
      ddl-auto: update  # Updates schema, doesn't delete data
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 20
    database-platform: org.hibernate.dialect.MySQL8Dialect

cowtrack:
  jwt:
    # MUST be overridden in any deployed environment. Minimum 32 characters.
    # Generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  cors:
    # Origins permitted to call the API. The CRA dev server runs on 3000.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging Configuration
logging:
  level:
    com.cowtrack: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
