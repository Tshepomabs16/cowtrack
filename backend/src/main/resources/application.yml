# Server Configuration
server:
  port: 8081

spring:
  data:
    web:
      pageable:
        # A ceiling on what one request may ask for. Without it ?size=1000000
        # turns a paginated endpoint back into an unpaginated one, which is the
        # problem paging it was meant to solve.
        max-page-size: 200
        default-page-size: 25

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cowtrack}
    username: ${DB_USERNAME:postgres}
    # Never hardcode this. Export DB_PASSWORD in the environment that runs the app.
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: CowTrackHikariPool

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    open-in-view: false  # Avoids holding a DB connection for the whole request
    hibernate:
      # Schema is owned by Flyway migrations in src/main/resources/db/migration.
      # Hibernate verifies the schema matches the entities and never mutates it.
      ddl-auto: validate
    # Verbose SQL logging is opt-in per environment (see application-dev.yml):
    # in production it floods the log and writes query parameters - including
    # personal data - to disk on every request.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
    database-platform: org.hibernate.dialect.PostgreSQLDialect

cowtrack:
  jwt:
    # MUST be overridden in any deployed environment. Minimum 32 characters.
    # Generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  cors:
    # Origins permitted to call the API. The CRA dev server runs on 3000.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  monitoring:
    no-signal:
      # A collar unheard for longer than this raises one alert per animal.
      # Tune to the reporting interval of the hardware in use.
      enabled: ${NO_SIGNAL_SWEEP_ENABLED:true}
      threshold: ${NO_SIGNAL_THRESHOLD:24h}
      cron: ${NO_SIGNAL_CRON:0 0 * * * *}
      ignore-never-reported: true
    night-movement:
      # Sustained movement in the small hours is the signature of an animal
      # being driven off. The distance must clear ordinary shuffling at a trough.
      enabled: ${NIGHT_MOVEMENT_ENABLED:true}
      start-hour: 22
      end-hour: 5
      threshold-metres: 100
      window: 1h
      # Interpreted in this zone. Belongs on the farm once one deployment serves
      # farms in more than one timezone.
      zone: ${NIGHT_MOVEMENT_ZONE:Africa/Johannesburg}
  storage:
    # Where uploaded images are written. Override for a deployed environment.
    upload-dir: ${UPLOAD_DIR:./uploads}

# Management endpoints for production observability. Readiness/liveness probes
# are what a container orchestrator or load balancer queries to decide whether
# this instance can take traffic. Only health and info are exposed; every other
# actuator endpoint stays disabled.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging Configuration
logging:
  level:
    # Sensible quiet defaults so production does not turn every log line into a
    # record of personal data. Application DEBUG and SQL traces are switched on
    # by the dev profile, which overrides the levels below.
    com.cowtrack: INFO
    org.springframework.web: INFO
