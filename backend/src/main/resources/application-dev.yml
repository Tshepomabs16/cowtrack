# Development profile: in-memory H2 instead of PostgreSQL.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar target/cowtrack-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
#
# Data is discarded when the process stops. Use the default profile for PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:cowtrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Flyway applies the same migrations the production database runs.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    # Verbose SQL so a developer can see what a request made Hibernate do.
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# The default profile is deliberately quiet; development is where extra logging
# earns its keep, so it is turned back on here.
logging:
  level:
    com.cowtrack: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

cowtrack:
  seed:
    # The dev profile uses a throwaway in-memory database, so seeding it on
    # startup costs nothing and gives every screen something to show.
    enabled: true
